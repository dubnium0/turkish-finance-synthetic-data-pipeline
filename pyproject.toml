[project]
name = "turkish-finance-synthetic-data-pipeline"
version = "0.1.0"
description = "A review-first synthetic data pipeline for Turkish financial tool use"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
tcg = "tcg.cli:main"

[project.optional-dependencies]
dev = [
    "ftfy>=6.3",
    "pytest>=8.0",
    "ruff>=0.8",
]
release = [
    "huggingface-hub>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["EXE002"]
